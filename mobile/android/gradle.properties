# -Xmx8G (the Flutter template default) requests the ENTIRE physical RAM
# on this 8GB development machine, causing severe memory pressure once
# WSL2/Docker and everything else is also running — this was the actual
# root cause of a string of "Could not close incremental caches" Kotlin
# compiler failures during Phase 5 bring-up, not a real code/config bug.
# 2G is comfortably enough for this project's build.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
